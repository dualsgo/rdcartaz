    <script>
        // Essa variavel é usada pelo controller dinamicaComercialController para intercambear
        // com essa página os dados que serão enviados ao previewer
      var $dadosDoCartazPreviewer;
        var $opcionaisDoPreviewer = {
            "reinitialize": true
        };

        function getInitData() {
            return $dadosDoCartazPreviewer;
        }

        function getOptions() {
            return $opcionaisDoPreviewer;
        }

        var sak = require('/assets/ravioli/helpers/sak');
        var params = sak.getRequestParams();

        window.client = params['client'];

        $(document).ready(function() {
            // Let the web composer to provide the data on a contract basis
            var pageData = getInitData();
            var options = getOptions();

            if (pageData) {
                displayData(params['client'], pageData, options);
            }
        });

        $(window).resize(function() {
            adjustZoom();
        });

        function displayData(client, pageData, options) {
            var previewer = require('/ravioli/previewer');

            previewer.draw(client, pageData, options, function(label) {
                adjustZoom();
                inspector();
                guideliner();
                bounder();

                // Is parent looking forward to init its form with template's hardcoded data?
                if (parent.initFormData) {
                    var formData = {};
                    var fields = label.fields;

                    fields.forEach(function(field) {
                        if (field.bindTo) {
                            if (field.text) {
                                formData[field.bindTo] = field.text;
                            } else {
                                formData[field.bindTo] = field.money;
                            }
                        }
                    });

                    parent.initFormData(formData);
                }
            });
        }

        function redisplayData(client, pageData, options) {
          var previewer = require('/assets/ravioli/previewer');

            previewer.draw(client, pageData, options, function(label) {
                adjustZoom();
                inspector();
                guideliner();
                bounder();
            });
        }

        function changeTemplate(client, pageData, options) {
            $('#label').empty();

            displayData(client, pageData, options);
        }

        function adjustZoom() {
            var bodyTag = document.querySelector('body');

            var height = window.innerHeight;
            var width = window.innerWidth;

            if (navigator.userAgent.toLowerCase().indexOf('firefox') > -1) {
                bodyTag.style.MozTransform = '';
            }

            var labelHeight = parseFloat($('#label').css('height').replace('px', ''));
            var labelWidth = parseFloat($('#label').css('width').replace('px', ''));

            var zoomByWidth = (labelWidth * (height / labelHeight)) > width;
            var zoom = 100;

            if (zoomByWidth) {
                zoom = (width / labelWidth) * 100;
            } else {
                zoom = (height / labelHeight) * 100;
            }

            //

            if (navigator.userAgent.toLowerCase().indexOf('firefox') > -1) {
                zoomCalc = zoom / 100;
                zoomCalc = zoomCalc.toString();
                result = zoomCalc.substring(0, 4);

                bodyTag.style.zoom = zoomCalc;
                bodyTag.style.MozTransformOrigin = "0 0";
                bodyTag.style.MozTransform = 'scale(' + result + ')';
                bodyTag.style.WebkitTransform = 'scale(' + result + ')';
            } else {
                $('body').css('zoom', zoom + '%');
            }
            //pra alinhar o conteúdo do iframe ao centro
            $('#label').css('position', 'relative');
            $('#label').css('margin', '0 auto');
        }

        function inspector(state) {
            if (!state) {
                state = localStorage.getItem('inspector');

                if (!state) {
                    state = 'off';
                }
            }

            localStorage.setItem('inspector', state);

            if (params['client'] === 'web') {
                var labelDiv = $('#label');
                var previewer = require('/assets/ravioli/previewer');

                previewer.switchInspector(labelDiv, state);
            }
        }

        function guideliner(state) {
            if (!state) {
                state = localStorage.getItem('guideliner');

                if (!state) {
                    state = 'off';
                }
            }

            localStorage.setItem('guideliner', state);

            if (params['client'] === 'web') {
                var labelDiv = $('#label');
                var previewer = require('/assets/ravioli/previewer');

                previewer.switchGuideliner(labelDiv, state);
            }
        }

        function bounder(state) {
            if (!state) {
                state = localStorage.getItem('bounder');

                if (!state) {
                    state = 'off';
                }
            }

            localStorage.setItem('bounder', state);

            if (params['client'] === 'web') {
                var labelDiv = $('#label');
                var previewer = require('/assets/ravioli/previewer');

                previewer.switchBounder(labelDiv, state);
            }
        }

        function getLabelSnapshot() {
            return $('#label').get(0).outerHTML;
        }
